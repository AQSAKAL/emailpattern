[project]
name = "emailpattern"
version = "0.2.1"
description = "Find the email format any company uses, and the likely address for a person there. Python SDK and command line; free, no account."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EmailPattern" }]
keywords = ["email", "email-finder", "sdk", "api-client", "email-format", "email-pattern", "lead-generation", "sales", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich-click>=1.8",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://emailpattern.com"
Documentation = "https://emailpattern.com/#cli"
Source = "https://github.com/AQSAKAL/emailpattern"
Issues = "https://github.com/AQSAKAL/emailpattern/issues"

[project.scripts]
emailpattern = "emailpattern.cli:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emailpattern"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
