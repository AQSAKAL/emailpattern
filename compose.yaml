# Runs behind an existing reverse proxy that reaches emailpattern-web:4321 over a shared Docker
# network, so no ports are published here. Set PROXY_NETWORK in a .env next to this file
# (not committed) to that network's name.
services:
  emailpattern-web:
    build: .
    image: emailpattern-web:latest
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      - data:/data
    networks:
      - proxy

networks:
  proxy:
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env to your reverse proxy's Docker network}
    external: true

volumes:
  data:
