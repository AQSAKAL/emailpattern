# Runs on a shared server as a side project. The box's Caddy (part of the host
# stack) owns ports 80 and 443 and routes emailpattern.com to emailpattern-web:4321 over
# the stack's <proxy-network> overlay network, so nothing is published here.
services:
  emailpattern-web:
    build: .
    image: emailpattern-web:latest
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      - data:/data
    networks:
      - <proxy-network>

networks:
  <proxy-network>:
    external: true

volumes:
  data:
